name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint + build Cloudflare (OpenNext)
    runs-on: ubuntu-latest
    env:
      # Sem Supabase o build usa mock-data; o número é só para o link wa.me.
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5511999999999"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Mesmo comando configurado como "Build command" no painel da Cloudflare.
      # Executa `next build` e gera .open-next/worker.js + .open-next/assets.
      - run: npm run build:cloudflare

      - name: Valida a configuração do Worker (sem publicar)
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

      - name: Resumo da saída
        run: du -sh .open-next .open-next/assets .open-next/worker.js
