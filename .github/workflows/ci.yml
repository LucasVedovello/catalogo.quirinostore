name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, build e pages:build (Cloudflare)
    runs-on: ubuntu-latest
    env:
      # Sem Supabase o build usa mock-data; o número é só para o link wa.me.
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5511999999999"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Mesmo comando configurado no painel da Cloudflare Pages.
      # Roda `vercel build` (que executa `next build`) e converte a saída para Workers.
      - run: npm run pages:build

      - name: Resumo da saída
        run: |
          echo "Funções edge geradas:" && ls -R .vercel/output/static/_worker.js | head -40
          du -sh .vercel/output/static
